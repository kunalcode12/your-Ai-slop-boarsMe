[package]
name = "credits"
version = "0.1.0"
edition = "2021"
description = "your ai slop bores me — on-chain credit economy (Solana devnet / MagicBlock ER)"

[lib]
crate-type = ["cdylib", "lib"]
name = "credits"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "session-keys/idl-build"]
# ER MODE (off by default for the on-chain settle layer). Enables the MagicBlock
# ephemeral-rollup delegate / commit / undelegate instructions. The credit economy
# runs on PLAIN DEVNET without this; turning it on is additive (extra instructions),
# so the app is never blocked on ER. Toolchain: Anchor 1.0.2 + Solana 3.1.10, which
# is what ephemeral-rollups-sdk 0.15.5 (anchor-modern path) targets.
er = ["dep:ephemeral-rollups-sdk"]

[dependencies]
anchor-lang = "1.0.2"

# Session keys (MagicBlock `session-keys` 3.1.1). ALWAYS ON: spend/earn accept either
# the player's own authority / the server authority (auth_expr branch) OR a registered
# session key (session_token branch) — see `Mutate` + `#[session_auth_or]` in lib.rs.
# `no-entrypoint` re-exports the `Session` derive + `session_auth_or` attribute macro.
# anchor-lang requirement is `>=0.28, <2.0`, so it links cleanly against anchor 1.0.2.
# On-chain SessionToken accounts are owned by the session program
# KeyspM2ssCJbqUhQ4k7sveSiY4WjnYsrXkC8oDbwde5 (deployed on devnet by MagicBlock).
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }

# Pulled in only with --features er. Crate is hyphenated (`ephemeral-rollups-sdk`,
# imported in Rust as `ephemeral_rollups_sdk`). The `anchor` feature == `anchor-modern`
# == anchor-lang 1.0 path (verified in the crate's own Cargo [features], Jun 2026).
# Provides the #[ephemeral]/#[delegate]/#[commit] macros, cpi::DelegateConfig, and the
# ephem::MagicIntentBundleBuilder used for commit / commit_and_undelegate.
ephemeral-rollups-sdk = { version = "0.15.5", features = ["anchor"], optional = true }
