[package]
name = "credits"
version = "0.1.0"
edition = "2021"
description = "your ai slop bores me — on-chain credit economy (Solana devnet / MagicBlock ER)"

[lib]
crate-type = ["cdylib", "lib"]
name = "credits"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# ER MODE (off by default). Enables MagicBlock ephemeral-rollup delegation/commit/
# undelegate instructions. The app runs on PLAIN DEVNET without this; turn it on as
# a separate, verified pass. See README "ER fallback switch".
er = ["dep:ephemeral-rollups-sdk"]

[dependencies]
anchor-lang = "0.32.1"

# Pulled in only with --features er. Crate name is hyphenated (`ephemeral-rollups-sdk`,
# imported in Rust as `ephemeral_rollups_sdk`). Version verified against crates.io
# (0.15.5, Jun 2026) and docs.magicblock.gg.
#
# KNOWN BLOCKER (verified by attempting `anchor build -- --features er`):
# 0.15.5 targets the Solana 3.x stack (solana-program ^3.0, solana-address ^2.0) and
# anchor-lang ^1.0, while this program is on anchor-lang 0.32.1 / Solana 2.x. The two
# pull incompatible copies of solana-program-error etc., so the ER feature does NOT
# link on the current toolchain. Enabling ER requires migrating the whole program to
# Anchor 1.0 + Solana 3.x (and `anchor-cli` 1.0). Deferred per the master spec's
# "never block the app on ER" rule. The session-keys crate (latest 3.1.1) has the
# same requirement.
ephemeral-rollups-sdk = { version = "0.15.5", features = ["anchor"], optional = true }

# Session keys (MagicBlock `session-keys` 1.0.0) are documented + scaffolded for
# the `er` pass but intentionally NOT wired into core instructions yet (doing so
# changes spend/earn account layouts). See SESSION_KEYS note in lib.rs. To enable:
#   session-keys = { version = "1.0.0", features = ["no-entrypoint"], optional = true }
